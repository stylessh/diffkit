<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DiffKit</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <header class="bar">
      <img class="mark" src="icons/logo.svg" alt="">
      <h1 class="title">DiffKit</h1>
      <label class="master">
        <span id="master-state"></span>
        <input
          id="enabled-toggle"
          class="switch"
          type="checkbox"
          role="switch"
          aria-label="Redirect GitHub pages to DiffKit"
        >
      </label>
    </header>

    <h2 id="rules-label" class="group-label">Open in DiffKit</h2>
    <div id="rule-list" class="rules" role="group" aria-labelledby="rules-label">
    </div>

    <footer class="popup-foot">
      <button id="edit-rules" class="text-link" type="button">Edit rules</button>
      <p id="status" class="status" role="status"></p>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
