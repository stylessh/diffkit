name: Dashboard — production deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/ui/**"
      - "packages/icons/**"
      - "packages/typescript-config/**"
      - "scripts/deploy-dashboard.mjs"
      - ".node-version"
      - ".github/workflows/dashboard-deploy-production.yml"
  workflow_dispatch:
    inputs:
      health_gate:
        description: "enforce: roll back if /login or /api/health fail after deploy. skip: deploy even while D1 or KV is degraded."
        type: choice
        options: [enforce, skip]
        default: enforce

concurrency:
  group: dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production binds its existing resources on every deploy. Without these
      # Void would create new, empty ones (void.config.ts), so refuse instead.
      - name: Check production resource pins
        env:
          DIFFKIT_D1_DATABASE_NAME: ${{ vars.DIFFKIT_D1_DATABASE_NAME }}
          DIFFKIT_D1_DATABASE_ID: ${{ vars.DIFFKIT_D1_DATABASE_ID }}
          DIFFKIT_KV_ID: ${{ vars.DIFFKIT_KV_ID }}
          DIFFKIT_R2_BUCKET: ${{ vars.DIFFKIT_R2_BUCKET }}
        run: |
          missing=0
          for name in DIFFKIT_D1_DATABASE_NAME DIFFKIT_D1_DATABASE_ID DIFFKIT_KV_ID DIFFKIT_R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy with Void, verify, roll back on failure
        working-directory: apps/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          DIFFKIT_D1_DATABASE_NAME: ${{ vars.DIFFKIT_D1_DATABASE_NAME }}
          DIFFKIT_D1_DATABASE_ID: ${{ vars.DIFFKIT_D1_DATABASE_ID }}
          DIFFKIT_KV_ID: ${{ vars.DIFFKIT_KV_ID }}
          DIFFKIT_R2_BUCKET: ${{ vars.DIFFKIT_R2_BUCKET }}
          DIFFKIT_DOMAIN: ${{ vars.DIFFKIT_DOMAIN }}
          WORKER_NAME: diffkit
          # `void deploy` runs the Vite build, which needs more than the default heap.
          NODE_OPTIONS: --max-old-space-size=4096
          HEALTH_GATE: ${{ inputs.health_gate || 'enforce' }}
        run: node ../../scripts/deploy-dashboard.mjs
